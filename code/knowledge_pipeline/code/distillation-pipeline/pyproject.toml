[project]
name = "distillation-pipeline"
version = "0.1.0"
description = "Document → Distillate → Knowledge Graph ingestion pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "typer>=0.12",
    "tenacity>=8.2",
    "anyio>=4.3",
    # Optional / adapter-specific (kept here for simplicity; in prod split into extras)
    "neo4j>=5.18",
    "pypdf>=4.0",
    "instructor>=1.15.1",
    "openai>=2.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.9",
    "ruff>=0.3",
]


[project.scripts]
distill = "distillation.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# Typer uses call expressions (Argument/Option) as parameter defaults by design.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
# The orchestrator deliberately catches every exception per stage so that a
# single failing document is dead-lettered and the pipeline keeps going
# (the "ontology over accuracy" failure philosophy).
"src/distillation/pipeline/orchestrator.py" = ["BLE001"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
